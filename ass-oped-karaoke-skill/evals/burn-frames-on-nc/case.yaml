schema_version: "1.1"
name: burn-frames-on-nc
expected_outcome: |
  給出 skill 的 frames.py 指令：--ass demo_op.built.ass --video <ncop> --shift -1678 --fps 24000/1001
  -t 15 59，並說明 --shift 是在記憶體裡平移、不會動到檔案，所以**不需要**先產生一份 NC 版字幕。
  不應該叫人先跑 offset 產生中間檔，也不應該自己拼一條 ffmpeg subtitles= 指令而忽略路徑與 -copyts 的坑。
