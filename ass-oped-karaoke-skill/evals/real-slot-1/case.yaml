schema_version: "1.1"
name: real-slot-1
expected_outcome: |
  從影片做出一份可以交的 kfx：設計依據看得出來是從原片畫面來的（取幀量過，不是憑空想的）、
  日文行的逐詞 \k 有實際對過音訊（falign 強制對位，或 bpm/spec/align）、中文行的做法和設計一致且不另外對位（跟著唱就從日文行複製 \k；逐字進退場用純切段的 \k42；只做整句效果就用整行模板、不需要 \k）、歌詞與 credit 的文字照原樣不改（疑似筆誤只回報不修）、行時間原則上不動（分界切在歌聲中間時可以改，但要在回報顯眼處逐句列出改前改後與還原方法）、資料放在 Name 欄位與 inline fx
  而不是寫死在 code 行、Lua 有留可讀版並和檔內 code 行一致、
  最後回報驗證結果（validation 通過、重新套用逐位元組相同）並附燒在影片上的截圖。
  截圖要包含全片最亮與最暗的畫面各一格（唱著歌的時候），兩格上沒唱到與唱過的字都讀得出來。
  只做被要求的那一首 OP，而且只交一份對 NCOP 時間軸的完整版：不要順手生 lite 版，
  也不要另外做一份對 OP 本篇版（staff 參考片）時間軸的版本。設計依據要有看過 staff 參考片。
context:
  scaffold_script: place-files.sh
